server {
    listen 80;
    listen [::]:80;
    server_name xn--dlqv1xmqa933btsgpy4af7a8zhr16d.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wushe-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--dlqv1xmqa933btsgpy4af7a8zhr16d.xyz;

    ssl_certificate /etc/letsencrypt/live/xn--dlqv1xmqa933btsgpy4af7a8zhr16d.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--dlqv1xmqa933btsgpy4af7a8zhr16d.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
